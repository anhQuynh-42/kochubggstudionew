    <script>
      // Defensive guard for environments where window.fetch has only a getter
      (function() {
        try {
          var originalFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var currentFetch = originalFetch;
          if (typeof window !== 'undefined') {
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(fn) {
                  currentFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e1) {
              try {
                if (window.Window && window.Window.prototype) {
                  Object.defineProperty(window.Window.prototype, 'fetch', {
                    get: function() {
                      return currentFetch;
                    },
                    set: function(fn) {
                      currentFetch = fn;
                    },
                    configurable: true,
                    enumerable: true
                  });
                }
              } catch (e2) {}
            }
          }
        } catch (e) {}
      })();
    </script>
